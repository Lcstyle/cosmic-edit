name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: cosmic-edit

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libsystemd-dev \
            libonig-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/${{ env.BINARY_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-ubuntu-24.04-x86_64
          path: target/release/${{ env.BINARY_NAME }}

  build-fedora:
    name: Build (Fedora 43)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            gcc-c++ \
            make \
            pkg-config \
            git \
            gtk3-devel \
            libxkbcommon-devel \
            wayland-devel \
            mesa-libEGL-devel \
            dbus-devel \
            systemd-devel \
            oniguruma-devel

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          key: fedora

      - name: Build release binary
        run: |
          source "$HOME/.cargo/env"
          cargo build --release

      - name: Strip binary
        run: strip target/release/${{ env.BINARY_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-fedora-43-x86_64
          path: target/release/${{ env.BINARY_NAME }}

  release:
    name: Create GitHub Release
    needs: [build-ubuntu, build-fedora]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Download Ubuntu artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-ubuntu-24.04-x86_64
          path: artifacts/ubuntu

      - name: Download Fedora artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-fedora-43-x86_64
          path: artifacts/fedora

      - name: Rename binaries with platform suffix
        run: |
          mv artifacts/ubuntu/${{ env.BINARY_NAME }} artifacts/${{ env.BINARY_NAME }}-ubuntu-24.04-x86_64
          mv artifacts/fedora/${{ env.BINARY_NAME }} artifacts/${{ env.BINARY_NAME }}-fedora-43-x86_64
          sha256sum artifacts/${{ env.BINARY_NAME }}-* > artifacts/SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## cosmic-edit (Enhanced Fork)

            Pre-built binaries from the `feature/integrated-enhancements` branch.
            All code is built from public GitHub repositories — verify the source yourself.

            ### Source Repositories
            - **cosmic-edit**: https://github.com/Lcstyle/cosmic-edit/tree/feature/integrated-enhancements
            - **libcosmic** (patched): https://github.com/Lcstyle/libcosmic/tree/feat/expand-active-tab
            - **cosmic-text** (patched): https://github.com/Lcstyle/cosmic-text/tree/feature/rope-buffer

            ### Features in this build

            **Tab bar improvements (libcosmic)**
            - Active tab expands up to 500px to show more of the filename ([`2e87b4e`](https://github.com/Lcstyle/libcosmic/commit/2e87b4e), [`7eb73ae`](https://github.com/Lcstyle/libcosmic/commit/7eb73ae), [`eb2893e`](https://github.com/Lcstyle/libcosmic/commit/eb2893e))
            - Hover tooltip shows full file path after 500ms ([`61ce0d3`](https://github.com/Lcstyle/libcosmic/commit/61ce0d3))
            - Scroll-to-active keeps the active tab visible ([`2e87b4e`](https://github.com/Lcstyle/libcosmic/commit/2e87b4e))
            - Mouse wheel scrolling switches tabs ([`faed681`](https://github.com/Lcstyle/cosmic-edit/commit/faed681))

            **Session restore & hot exit**
            - Automatic session backup on close with crash recovery ([`502b747`](https://github.com/Lcstyle/cosmic-edit/commit/502b747))
            - Single window restore mode ([`468b3d5`](https://github.com/Lcstyle/cosmic-edit/commit/468b3d5))
            - Silent close UX for hot exit ([`f848be6`](https://github.com/Lcstyle/cosmic-edit/commit/f848be6))

            **Pinned tabs & notes**
            - Pin/unpin tabs with context menu ([`e8e4eed`](https://github.com/Lcstyle/cosmic-edit/commit/e8e4eed), [`7e73706`](https://github.com/Lcstyle/cosmic-edit/commit/7e73706))
            - Dedicated pinned notes sidebar ([`0d64f96`](https://github.com/Lcstyle/cosmic-edit/commit/0d64f96))
            - Markdown rendering with view mode toggle ([`f801169`](https://github.com/Lcstyle/cosmic-edit/commit/f801169), [`1bd09e2`](https://github.com/Lcstyle/cosmic-edit/commit/1bd09e2))
            - AI filename suggestions via Claude API ([`1c71ee2`](https://github.com/Lcstyle/cosmic-edit/commit/1c71ee2))

            **Large file handling**
            - Memory explosion fix for 100K+ line files ([`5354354`](https://github.com/Lcstyle/cosmic-edit/commit/5354354))
            - Rope buffer for viewing very large files (experimental) ([`9b823da`](https://github.com/Lcstyle/cosmic-edit/commit/9b823da))

            **Search improvements**
            - "List matches" option in Find dialog ([`addbd4d`](https://github.com/Lcstyle/cosmic-edit/commit/addbd4d))
            - Resizable results window with context menu ([`05d82b0`](https://github.com/Lcstyle/cosmic-edit/commit/05d82b0))

            **Bug fixes**
            - Save As no longer creates duplicate tabs ([`9d32449`](https://github.com/Lcstyle/cosmic-edit/commit/9d32449))
            - Normalized file paths and stable tab updates ([`a1d7f38`](https://github.com/Lcstyle/cosmic-edit/commit/a1d7f38))

            ### Installation

            **IMPORTANT:** Install to `/usr/local/bin/`, NOT `/usr/bin/`. Your package manager owns `/usr/bin/cosmic-edit` — overwriting it will break package updates. `/usr/local/bin` takes priority in `$PATH` and won't conflict.

            ```bash
            sudo cp cosmic-edit-<distro>-x86_64 /usr/local/bin/cosmic-edit
            sudo chmod +x /usr/local/bin/cosmic-edit
            ```

            On Fedora with SELinux:
            ```bash
            sudo restorecon /usr/local/bin/cosmic-edit
            ```

            To revert to your distro's packaged version:
            ```bash
            sudo rm /usr/local/bin/cosmic-edit
            ```

            ### SHA256 Checksums
            See `SHA256SUMS.txt` for verification.

            ### Runtime dependencies

            **Ubuntu 24.04:**
            ```
            libgtk-3-0 libegl1 libwayland-client0 libxkbcommon0 libdbus-1-3 libonig5
            ```

            **Fedora 43:**
            ```
            gtk3 mesa-libEGL wayland libxkbcommon dbus-libs oniguruma
            ```
          files: |
            artifacts/${{ env.BINARY_NAME }}-ubuntu-24.04-x86_64
            artifacts/${{ env.BINARY_NAME }}-fedora-43-x86_64
            artifacts/SHA256SUMS.txt
